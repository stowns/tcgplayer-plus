<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCGPlayer+</title>
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="lists.css">
  <link rel="stylesheet" href="orders.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__top">
      <h1>TCGPlayer+</h1>
      <div class="app-header__tools">
        <span id="cacheStatus" role="status"></span>
        <button type="button" id="clearCache" class="secondary">Clear price cache</button>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="TCGPlayer+ views">
      <button type="button" class="tab" role="tab" id="tab-lists" data-view="lists" aria-controls="view">Watch Lists</button>
      <button type="button" class="tab" role="tab" id="tab-orders" data-view="orders" aria-controls="view">Order History</button>
    </div>
  </header>
  <main id="view" role="tabpanel"></main>
  <script src="home.js"></script>
</body>
</html>
